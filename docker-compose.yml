services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm -d gymcrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-vector-init:
    image: pgvector/pgvector:pg16
    container_name: gym-crm-postgres-vector-init
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: gymcrm
      PGPASSWORD: gymcrm_password
      PGDATABASE: gymcrm
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;' "]
    restart: "no"

  workout-embeddings:
    image: ollama/ollama:0.11.10
    container_name: gym-crm-workout-embeddings
    volumes:
      - workout_embeddings_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull embeddinggemma:300m-qat-q4_0; wait $$pid"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'embeddinggemma' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  postgres-backup:
    image: postgres:16-alpine
    container_name: gym-crm-postgres-backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: gymcrm
      PGPASSWORD: gymcrm_password
      PGDATABASE: gymcrm
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - postgres_backups:/backups
      - ./scripts/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    container_name: gym-crm-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:4000
    container_name: gym-crm-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:4000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: gym-crm-backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://gymcrm:gymcrm_password@postgres:5432/gymcrm?schema=public
      VALKEY_URL: redis://valkey:6379
      FRONTEND_URL: http://frontend:3000
      COOKIE_SECURE: "false"
      WORKOUT_AI_PROVIDER: ollama-cloud
      WORKOUT_AI_MODEL: gpt-oss:120b
      OLLAMA_HOST: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      WORKOUT_EMBEDDING_HOST: http://workout-embeddings:11434
      WORKOUT_EMBEDDING_MODEL: embeddinggemma:300m-qat-q4_0
      WORKOUT_EMBEDDING_DIMENSIONS: 768
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      RENEWAL_SECRET: ${RENEWAL_SECRET:-fuira-gym-renewal-secret-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-vector-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  postgres_backups:
  valkey_data:
  workout_embeddings_data:
